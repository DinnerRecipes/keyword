<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyword Generator Pro - Bing Suggest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        textarea::-webkit-scrollbar { width: 8px; }
        textarea::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        textarea::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        textarea::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        #toast {
            visibility: hidden; min-width: 250px; background-color: #333; color: #fff;
            text-align: center; border-radius: 8px; padding: 12px 24px; position: fixed;
            z-index: 50; left: 50%; bottom: 30px; transform: translateX(-50%);
            opacity: 0; transition: opacity 0.3s, bottom 0.3s, visibility 0.3s;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        #toast.show { visibility: visible; opacity: 1; bottom: 50px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

    <nav class="bg-orange-600 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-bolt text-2xl"></i>
                <h1 class="text-xl font-bold">Keyword Generator Pro (Bing Mode)</h1>
            </div>
            <div class="text-xs bg-orange-700 px-3 py-1 rounded-full uppercase tracking-wider">Bing API</div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <div class="lg:col-span-4 space-y-6">
                
                <div class="bg-indigo-50 p-5 rounded-xl shadow-sm border border-indigo-200">
                    <label class="block text-sm font-bold mb-3 text-indigo-700 flex items-center">
                        <i class="fa-solid fa-layer-group mr-2"></i> Kombinasi Multi-Keyword
                    </label>
                    <div class="space-y-3">
                        <div class="flex gap-2">
                            <input type="text" id="kw1" placeholder="Kata 1 (Misal: wallpaper)" class="w-full border border-indigo-300 rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
                            <input type="text" id="kw2" placeholder="Kata 2 (Misal: iphone)" class="w-full border border-indigo-300 rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
                        </div>
                        <button onclick="generateMultiKeyword()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-lg text-sm font-medium transition-all shadow-sm flex justify-center items-center">
                            <i class="fa-solid fa-wand-magic-sparkles mr-2"></i> Terapkan Kombinasi
                        </button>
                        <p class="text-[11px] text-indigo-600/80 text-center leading-tight">Membantu membuat kombinasi bolak-balik & otomatis menyetel filter positif ke mode "Wajib Semua Kata".</p>
                    </div>
                </div>

                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                    <label class="block text-sm font-semibold mb-2">Keyword Utama (Seeds)</label>
                    <textarea id="seeds" rows="3" class="w-full border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-orange-500 outline-none" placeholder="Contoh: cara memancing"></textarea>
                </div>
                
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                    <label class="block text-sm font-semibold mb-2 text-slate-700 flex items-center">
                        <i class="fa-solid fa-earth-americas mr-2 text-indigo-500"></i> Target Bahasa & Wilayah
                    </label>
                    <select id="marketFilter" class="w-full border border-slate-300 rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500 bg-white cursor-pointer">
                        <option value="en-US" selected>English (USA)</option>
                        <option value="en-GB">English (UK)</option>
                        <option value="en-CA">English (Canada)</option>
                        <option value="id-ID">Indonesian (Indonesia)</option>
                        <option value="ms-MY">Malay (Malaysia)</option>
                        <option value="es-ES">Spanish (Spain)</option>
                        <option value="pt-BR">Portuguese (Brazil)</option>
                        <option value="de-DE">German (Germany)</option>
                    </select>
                </div>

                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                    <label class="block text-sm font-semibold mb-2 text-slate-700 flex items-center">
                        <i class="fa-solid fa-file-word mr-2 text-indigo-500"></i> Minimum Word Count
                    </label>
                    <select id="minWordCount" class="w-full border border-slate-300 rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500 bg-white cursor-pointer">
                        <option value="0">Tampilkan Semua</option>
                        <option value="3">Min. 3 Kata</option>
                        <option value="4">Min. 4 Kata</option>
                        <option value="5">Min. 5 Kata</option>
                        <option value="6">Min. 6 Kata</option>
                    </select>
                </div>

                <div class="bg-white p-5 rounded-xl shadow-sm border border-blue-200 relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-1 h-full bg-blue-500"></div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="block text-sm font-semibold text-blue-700">Filter Positif</label>
                        <select id="posFilterMode" class="text-xs border border-blue-200 rounded p-1 outline-none text-blue-700 bg-blue-50 font-medium cursor-pointer">
                            <option value="AND" selected>Wajib Semua (AND)</option>
                            <option value="OR">Salah Satu (OR)</option>
                        </select>
                    </div>
                    <textarea id="positive" rows="2" class="w-full border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Pisahkan dengan koma atau enter.&#10;Contoh: wallpaper, iphone"></textarea>
                </div>
                
                <div class="bg-white p-5 rounded-xl shadow-sm border border-red-200 relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-1 h-full bg-red-500"></div>
                    <label class="block text-sm font-semibold mb-2 text-red-700">Filter Negatif (Buang)</label>
                    <textarea id="negative" rows="2" class="w-full border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-red-500 outline-none" placeholder="Kata yang ingin dihapus..."></textarea>
                </div>

                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                    <label class="block text-sm font-semibold mb-3 flex items-center text-slate-700">
                        <i class="fa-solid fa-arrows-rotate mr-2 text-indigo-500"></i> Replace Text
                    </label>
                    <div class="space-y-3">
                        <input type="text" id="findText" class="w-full border border-slate-300 rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Cari kata...">
                        <input type="text" id="replaceWith" class="w-full border border-slate-300 rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Ganti dengan...">
                        <button onclick="replaceContent()" class="w-full bg-slate-700 hover:bg-slate-800 text-white py-2 rounded-lg text-sm font-medium transition-all">Ganti Massal</button>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-8 flex flex-col space-y-4">
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap gap-3 items-center justify-between sticky top-4 z-10">
                    <div class="flex gap-2">
                        <button id="startBtn" onclick="startJob()" class="bg-orange-600 hover:bg-orange-700 text-white px-6 py-2.5 rounded-lg font-medium flex items-center transition-all shadow-sm">
                            <i class="fa-solid fa-play mr-2"></i> Mulai
                        </button>
                        <button id="stopBtn" onclick="stopJob()" disabled class="bg-red-500 hover:bg-red-600 text-white px-6 py-2.5 rounded-lg font-medium disabled:opacity-50 transition-all shadow-sm">
                            <i class="fa-solid fa-stop mr-2"></i> Berhenti
                        </button>
                    </div>
                    <div class="flex flex-wrap gap-2">
                        <button onclick="removeDuplicates()" class="bg-slate-700 hover:bg-slate-800 text-white px-4 py-2.5 rounded-lg text-sm flex items-center transition-all">
                            <i class="fa-solid fa-filter-circle-xmark mr-2"></i> Hapus Duplikat
                        </button>
                        <button onclick="clearAll()" class="bg-slate-200 hover:bg-slate-300 px-4 py-2.5 rounded-lg text-sm transition-all text-slate-700 font-medium">Reset</button>
                        <button onclick="copyToClipboard()" class="bg-emerald-500 hover:bg-emerald-600 text-white px-4 py-2.5 rounded-lg text-sm font-medium flex items-center transition-all shadow-sm">
                            <i class="fa-solid fa-copy mr-2"></i> Salin Hasil
                        </button>
                    </div>
                </div>

                <div class="flex justify-between px-2 text-sm font-medium">
                    <span id="statusText" class="text-slate-500 flex items-center"><i class="fa-solid fa-circle-info mr-2 text-blue-500"></i>Status: Siap</span>
                    <span class="text-orange-600 font-bold bg-orange-100 px-3 py-1 rounded-full">Total: <span id="countText">0</span></span>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col h-[700px] overflow-hidden">
                    <div class="bg-slate-100 border-b p-3 text-xs text-slate-600 font-semibold flex justify-between">
                        <span class="flex items-center"><i class="fa-brands fa-microsoft mr-2 text-blue-600"></i> Output Bing Suggest</span>
                        <span id="queueText" class="bg-slate-200 px-2 py-0.5 rounded text-slate-700">Sisa Antrian: 0</span>
                    </div>
                    <textarea id="output" readonly class="flex-grow p-4 font-mono text-sm resize-none outline-none bg-slate-50/50 leading-relaxed"></textarea>
                </div>
            </div>
        </div>
    </main>

    <div id="toast"></div>

    <script>
        let isRunning = false;
        let queue = [];
        let seen = new Set();
        let count = 0;

        function showToast(msg, isErr = false) {
            const t = document.getElementById("toast");
            t.innerText = msg;
            t.style.backgroundColor = isErr ? "#ef4444" : "#333";
            t.className = "show";
            setTimeout(() => t.className = "", 3000);
        }

        function updateStatus(txt) {
            document.getElementById("statusText").innerHTML = `<i class="fa-solid fa-circle-notch fa-spin mr-2 text-orange-500" ${isRunning ? '' : 'style="display:none;"'}></i>Status: ${txt}`;
        }

        // FITUR BARU: Generate Kombinasi Bolak-Balik
        function generateMultiKeyword() {
            const kw1 = document.getElementById('kw1').value.trim().toLowerCase();
            const kw2 = document.getElementById('kw2').value.trim().toLowerCase();
            
            if(!kw1 || !kw2) {
                showToast("Masukkan kedua keyword (Kata 1 & Kata 2)!", true);
                return;
            }
            
            // Masukkan kombinasi ke form Seed
            const seedsEl = document.getElementById('seeds');
            const newSeeds = `${kw1} ${kw2}\n${kw2} ${kw1}`;
            seedsEl.value = seedsEl.value ? seedsEl.value + "\n" + newSeeds : newSeeds;
            
            // Masukkan keyword ke Filter Positif dan pastikan mode AND terpilih
            const posEl = document.getElementById('positive');
            posEl.value = `${kw1}, ${kw2}`;
            document.getElementById('posFilterMode').value = "AND";
            
            // Kosongkan form input setelah diterapkan
            document.getElementById('kw1').value = "";
            document.getElementById('kw2').value = "";
            
            showToast("Kombinasi sukses ditambahkan ke Seed & Filter!");
        }

        function fetchBingKeywords(query, marketCode) {
            return new Promise((resolve) => {
                const callbackName = 'bing_cb_' + Math.random().toString(36).substr(2, 9);
                const script = document.createElement('script');
                
                window[callbackName] = (data) => {
                    delete window[callbackName];
                    if (script.parentNode) document.body.removeChild(script);
                    if (data && Array.isArray(data) && data.length > 1) {
                        resolve(data[1]);
                    } else {
                        resolve([]);
                    }
                };

                script.src = `https://api.bing.com/osjson.aspx?query=${encodeURIComponent(query)}&mkt=${marketCode}&JsonType=callback&JsonCallback=${callbackName}`;
                script.onerror = () => {
                    delete window[callbackName];
                    if (script.parentNode) document.body.removeChild(script);
                    resolve([]);
                };
                document.body.appendChild(script);
                setTimeout(() => {
                    if (window[callbackName]) {
                        delete window[callbackName];
                        if (script.parentNode) document.body.removeChild(script);
                        resolve([]);
                    }
                }, 3000);
            });
        }

        async function startJob() {
            const seedsRaw = document.getElementById("seeds").value;
            const seeds = seedsRaw.split("\n").map(s => s.trim()).filter(s => s);

            if (seeds.length === 0) {
                showToast("Silakan masukkan keyword awal!", true);
                return;
            }

            isRunning = true;
            document.getElementById("startBtn").disabled = true;
            document.getElementById("stopBtn").disabled = false;
            updateStatus("Bing sedang bekerja...");

            const minWords = parseInt(document.getElementById("minWordCount").value);
            const market = document.getElementById("marketFilter").value;
            
            // LOGIKA FILTER POSITIF BARU: Pemisahan dengan koma atau enter
            const posFilterRaw = document.getElementById("positive").value;
            const posFilter = posFilterRaw.split(/[\n,]+/).map(s => s.trim().toLowerCase()).filter(s => s);
            const posFilterMode = document.getElementById("posFilterMode").value;
            
            const negFilter = document.getElementById("negative").value.split("\n").map(s => s.trim().toLowerCase()).filter(s => s);
            const output = document.getElementById("output");

            if (queue.length === 0) {
                const alpha = " abcdefghijklmnopqrstuvwxyz0123456789".split("");
                seeds.forEach(s => {
                    queue.push(s); 
                    alpha.forEach(l => {
                        queue.push(`${s} ${l}`.trim());
                    });
                });
            }

            while (isRunning && queue.length > 0) {
                const currentQuery = queue.shift();
                document.getElementById("queueText").innerText = `Sisa Antrian: ${queue.length}`;
                
                try {
                    const results = await fetchBingKeywords(currentQuery, market);
                    results.forEach(res => {
                        const lowRes = res.toLowerCase().trim();
                        if (!seen.has(lowRes)) {
                            seen.add(lowRes);
                            
                            // Check word count
                            const wordCount = lowRes.split(/\s+/).length;
                            const passMinWords = wordCount >= minWords;
                            
                            // Check positive filter (AND / OR Logic)
                            let passPos = true;
                            if (posFilter.length > 0) {
                                if (posFilterMode === "AND") {
                                    passPos = posFilter.every(f => lowRes.includes(f)); // SEMUA kata wajib ada
                                } else {
                                    passPos = posFilter.some(f => lowRes.includes(f));  // SALAH SATU kata wajib ada
                                }
                            }
                            
                            const passNeg = negFilter.length === 0 || !negFilter.some(f => lowRes.includes(f));

                            if (passMinWords && passPos && passNeg) {
                                output.value += (output.value ? "\n" : "") + res;
                                count++;
                                document.getElementById("countText").innerText = count;
                                output.scrollTop = output.scrollHeight;
                                if (lowRes.split(" ").length < 5) queue.push(res);
                            }
                        }
                    });
                } catch (e) { console.error(e); }
                await new Promise(r => setTimeout(r, 300));
            }
            if (queue.length === 0) stopJob();
        }

        function stopJob() {
            isRunning = false;
            document.getElementById("startBtn").disabled = false;
            document.getElementById("stopBtn").disabled = true;
            updateStatus("Proses Selesai / Berhenti");
        }

        function clearAll() {
            stopJob();
            queue = [];
            seen = new Set();
            count = 0;
            document.getElementById("output").value = "";
            document.getElementById("countText").innerText = "0";
            document.getElementById("queueText").innerText = "Sisa Antrian: 0";
            document.getElementById("statusText").innerHTML = `<i class="fa-solid fa-circle-info mr-2 text-blue-500"></i>Status: Siap`;
            showToast("Data dibersihkan");
        }

        function removeDuplicates() {
            const outputEl = document.getElementById('output');
            const lines = outputEl.value.split('\n').map(l => l.trim()).filter(l => l);
            const uniqueLines = [...new Set(lines)];
            
            outputEl.value = uniqueLines.join('\n');
            count = uniqueLines.length;
            document.getElementById("countText").innerText = count;
            
            seen = new Set(uniqueLines.map(l => l.toLowerCase()));
            
            showToast(`Duplikat dihapus. Sekarang: ${count} baris.`);
        }

        function replaceContent() {
            const outputEl = document.getElementById('output');
            const find = document.getElementById('findText').value;
            const replace = document.getElementById('replaceWith').value;

            if (!find) {
                showToast("Masukkan teks yang ingin dicari!", true);
                return;
            }

            const currentVal = outputEl.value;
            const escapedFind = find.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); 
            const regex = new RegExp(escapedFind, 'g');
            const newVal = currentVal.replace(regex, replace);
            
            outputEl.value = newVal;
            
            const lines = newVal.split('\n').map(l => l.trim().toLowerCase()).filter(l => l);
            seen = new Set(lines);
            
            showToast("Teks berhasil diganti massal.");
        }

        function copyToClipboard() {
            const outputEl = document.getElementById('output');
            const text = outputEl.value;
            if (!text) {
                showToast("Tidak ada hasil untuk disalin!", true);
                return;
            }
            outputEl.select();
            outputEl.setSelectionRange(0, 99999);
            try {
                const successful = document.execCommand('copy');
                if (successful) showToast("Berhasil disalin ke clipboard!");
                else showToast("Gagal menyalin.", true);
            } catch (err) { showToast("Error saat menyalin.", true); }
            window.getSelection().removeAllRanges();
        }
    </script>
</body>
</html>
